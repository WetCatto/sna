theme = "autumn_night"

[editor]
line-number = "relative" 
cursorline = true        
color-modes = true       
idle-timeout = 0         
true-color = true

[editor.cursor-shape]
insert = "bar"           
normal = "block"         
select = "underline"     

[editor.statusline]
left = ["mode", "spacer", "file-name", "read-only-indicator"]
center = ["diagnostics"]
right = ["selections", "position", "file-encoding", "file-type"]
separator = "|"
mode.normal = "NORMAL"
mode.insert = "INSERT"
mode.select = "SELECT"
