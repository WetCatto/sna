[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "janet"
version = "0.1.1"
description = "A network model of co-evolving beliefs and correlations"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "numpy",
    "scipy",
    "matplotlib",
    "networkx",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "ruff",
    "mypy",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["janet*"]

[tool.ruff]
target-version = "py314"
line-length = 80

[tool.ruff.lint]
select = ["E", "F", "I"]
extend-select = ["I"]

[tool.mypy]
python_version = "3.14"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
